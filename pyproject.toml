[project]
name = "arducampython"
version = "0.1.0"
description = "Arducam wrapper for Python 3.12+ and NumPy 2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.13.0.92",
    "pybind11>=2.12",
    "setuptools>=82.0.0",
]

[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.12", "cmake", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true